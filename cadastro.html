<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>CompreJá</title>
</head>
<body>

    <div class="pagina">

        <header class="cabecalho">
            <div class="cabecalho-principal">
                <h1 class="logo">CompreJá</h1>
            </div>
        </header>

        <main>
            <section>
                <h2>Cadastro</h2>
                <form>
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>
                    <div class="campo">
                        <label for="confirmar-senha">Confirmar Senha</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                    </div>
                    <label for="checkbox">
                        <input type="checkbox" id="checkbox" name="checkbox" required>
                        Li e aceito os termos de uso e privacidade.
                    </label>
                    <a href="index.html">Cadastrar</a>
                </form>
            </section>
        </main>

        <footer class="rodape">
            <section class="beneficios">
                <div class="beneficio">
                    <div class="icone-beneficio icone-pagamento">
                        <img src="img/cartao.png" alt="Ícone de pagamento">
                    </div>
                    <strong>Escolha como pagar</strong>
                </div>
                <div class="beneficio">
                    <div class="icone-beneficio icone-frete">
                        <img src="img/caixa.png" alt="Ícone de frete">
                    </div>
                    <strong>Frete grátis a partir de R$ 19</strong>
                </div>
                <div class="beneficio">
                    <div class="icone-beneficio icone-seguranca">
                        <img src="img/escudo-de-seguranca.png" alt="Ícone de segurança">
                    </div>
                    <strong>Segurança, do início ao fim</strong>
                </div>
            </section>
            <div class="links-rodape">
                <a href="#">Trabalhe conosco</a>
                <a href="#">Termos e condições</a>
                <a href="#">Promoções</a>
                <a href="#">Acessibilidade</a>
                <a href="#">Contato</a>
                <a href="#">Como cuidamos da sua privacidade</a>
                <a href="#">Informações sobre seguros</a>
                <a href="#">Programa de Afiliados</a>
            </div>
            <p>Copyright © 1999-2026. CompreJá Ltda.</p>
        </footer>
    </div>
</body>
</html>
